name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      # Cortafuegos del incidente que origino el plan: ningun secreto ni
      # empaquetado vuelve a entrar al repositorio. Ver docs/PLAN.md, tarea 1.3.
      - name: Verificar que no se versionen secretos ni zips
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.zip$'; then
            echo "::error::Se detecto un .env o un .zip versionado."
            exit 1
          fi

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se construye en cada PR sin publicar, para detectar builds rotos antes
      # del merge en vez de al desplegar.
      - name: Construir la imagen
        run: docker build -t denji-energy-advisor:ci .

      # Comprueba que ademas de construir, arranca y responde. Un Dockerfile que
      # compila pero cuyo contenedor muere al iniciar pasaria el paso anterior.
      - name: Arrancar y sondear /health
        run: |
          docker run -d --name denji-energy-advisor-ci -p 5000:5000 denji-energy-advisor:ci
          for intento in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health > /tmp/salud.json; then
              cat /tmp/salud.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::El contenedor no respondio en /health"
          docker logs denji-energy-advisor-ci
          exit 1

      - name: Verificar que la imagen no contiene secretos
        run: |
          if docker run --rm denji-energy-advisor:ci sh -c 'ls /app/.env' 2>/dev/null; then
            echo "::error::La imagen incluye un archivo .env."
            exit 1
          fi

      - name: Limpiar
        if: always()
        run: docker rm -f denji-energy-advisor-ci || true
